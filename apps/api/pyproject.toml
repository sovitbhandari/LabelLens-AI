[tool.poetry]
name = "labellens-api"
version = "0.1.0"
description = "LabelLens AI — pharmaceutical document intelligence API"
authors = ["Sovit Bhandari <bhandari4@usf.edu>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
psycopg = { extras = ["binary"], version = "^3.2.3" }
pgvector = "^0.3.6"
httpx = "^0.27.2"
tenacity = "^9.0.0"
pandas = "^2.2.3"
numpy = "^2.1.3"
lxml = "^5.3.0"
openai = "^1.54.0"
sentence-transformers = "^3.3.0"
mlflow = "^2.17.2"
structlog = "^24.4.0"
python-multipart = "^0.0.17"
orjson = "^3.10.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.4"
mypy = "^1.13.0"
httpx = "^0.27.2"
types-lxml = "^2024.11.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP038"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = []
